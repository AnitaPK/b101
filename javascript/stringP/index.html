<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="display-4 bg-dark text-white text-center p-5" style="text-shadow: 2px 2px 2px red;">
        STRING IN JAVASCRIPT
    </h1>

    <div class="container w-50">
        <div class="form-floating">
            <textarea class="form-control" placeholder="Leave a comment here" 
            id="inputPara"></textarea>
            <label for="inputPara">Enter Paragraph</label>
        </div>
        <div class="container bg-secondary" style="height: 100px;" id="result">Result</div>

        <div class="container">
            <div class="row">
                <div class="col"><button class="btn btn-dark mb-2" onclick="countVowels()">Count Vowels</button></div>
                <div class="col"><button class="btn btn-dark mb-2">Count Consonents</button></div>
                <div class="col"><button class="btn btn-dark mb-2" onclick="chechPalindrom()">Check Palindrome</button></div>
                <div class="col"><button class="btn btn-dark mb-2">Count lines</button></div>
                <div class="col"><button class="btn btn-dark mb-2">Count Spaces</button></div>
                <div class="col"><button class="btn btn-dark mb-2">Convert to Upper </button></div>
                <div class="col"><button class="btn btn-dark mb-2">Convert tp Lower</button></div>
                <div class="col"><button class="btn btn-dark mb-2">Convert To Camel Case</button></div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
