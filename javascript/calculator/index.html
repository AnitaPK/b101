<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Calculator</h1>

    <div class="container w-25">
<div class="input-group">
  <span class="input-group-text">First and Second Number</span>
  <input type="number" aria-label="First name" class="form-control" id="firstInput">
  <input type="number" aria-label="Last name" class="form-control" id="secondInput">
  <span class="input-group-text" id="result">Result</span>
</div>

<br>
<br>
<br>
<br>

<div class="btn-group" role="group" aria-label="Basic example">
  <button type="button" class="btn btn-primary" id="add">+</button>
  <button type="button" class="btn btn-primary" id="sub">-</button>
  <button type="button" class="btn btn-primary" id="mul">*</button>
  <button type="button" class="btn btn-primary" id="div">/</button>
</div>
</div>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
