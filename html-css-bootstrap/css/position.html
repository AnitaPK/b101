<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .box{
            width: 200px;
            height: 200px;
            background-image: url('./assets/userImg.png');
            background-repeat: no-repeat;
            background-size: cover;
            position: absolute;
            right: 0;
            top:40vh;
        }
        .parentDiv{
            width: 900px;
            height: 500px;
            margin: 100px auto;
            position: relative;
        }
        .natureImg{
            width: 100%;
            height: 100%;
        }
        .girlStainding{
            height: 550px;
            width: 250px;
            position: absolute;
            top:-150px;
            left: 30px;
            z-index: 1;
            mix-blend-mode:multiply;
            /* background-color: transparent; */
        }
        .girlSmiling{
            position: absolute;
            width: 200px;
            height: 250px;
            bottom: 20px;
            right: 50px;
            mix-blend-mode:multiply;
        }
        .textBox{
            width: 400px;
            height: 70px;
            padding: 20px;
            /* border: 2px ridge rgb(0, 183, 255); */
            position: absolute;
            left: 20px;
            bottom: 20px;
            font-size: 20px;
            text-shadow: 2px 2px 2px rgb(0, 183, 255);
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="parentDiv">
        <img src="./assets/nature.jpeg" alt="" class="natureImg">
        <img src="./assets/girlThree.jpeg" alt="" class="girlStainding">
        <img src="./assets/girlFour.jpeg" alt="" class="girlSmiling"> 
        <div class="textBox">Nature always wears the colors of the spirit.</div>
    </div>
</body>
</html>
