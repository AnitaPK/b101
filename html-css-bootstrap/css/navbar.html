<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="./navbar.css">
<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css" 
integrity="sha512-xWIcG98IArXxegzS8Vo9iYMKuPgbXOG8O1mlHrj4MmNFxsBDltGxHJGg4JK80MVEmLRpdbWtphhm+S6Wx9o73g==" crossorigin="anonymous"

<body>
    <nav class="navbarFirst">
        <div class="NavbarOne">
            <div class="leftSideImg">
                <img src="./assets/userImg.png" alt="">

                <li class="menuList"><a href="#" class="menuItem">HOME</a></li>
                <li class="menuList"><a href="#" class="menuItem">GALLERY</a></li>
                <li class="menuList"><a href="#" class="menuItem">ABOUT US</a></li>

        </div>
    </nav>
<hr>
<hr style="margin-bottom: 10px;">
<hr >
<nav class="navbarSecond">

        <div class="imgContainer">
            <img src="./assets/userImg.png" alt="">
        </div>
        <div class="searchConatiner">
            <input type="search">
            <button class="btnSearch">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="menuContainer">
            <div class="menuListOne"><a href="#" class="menuItemOne">HOME</a></div>
            <div class="menuListOne"><a href="#" class="menuItemOne">GALLERY</a></div>
            <div class="menuListOne"><a href="#" class="menuItemOne">ABOUT US</a></div>
            <div class="menuListOne"><a href="#" class="menuItemOne">CONTACT US</a></div>

        </div>
    </div>

</html>
