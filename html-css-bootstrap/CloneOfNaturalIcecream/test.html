<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <style>
        .customCarousel {
    height: 500px;
}

.customCarouselImg {
    width: 100%;
    height: 500px;
    object-fit: cover;
}


/* Dot Indicators */

.customIndicators button {
    display: inline-block;
    width: 12px !important;
    height: 12px !important;

    border-radius: 50% !important;

    border: none;

    margin: 0 5px;

    background-color: white;

    opacity: 0.6;
}

.customIndicators button.active {
    opacity: 1;
    background-color: white;
}
.customCarousel11 {
    height: 500px;
    position: relative !important;
}

.customCarouselImg {
    width: 100%;
    height: 500px;
    object-fit: cover;
}


/* Vertical Indicators - LEFT SIDE */

.verticalIndicators {
    position: absolute;

    top: 50%;
    right: 20px;
    /* right: auto; */

    transform: translateY(-50%);

    margin: 0;

    display: flex;
    flex-direction: column;

    gap: 10px;

    width: auto;

    z-index: 10;
}


/* Indicator Dots */

.verticalIndicators button {
    width: 12px;
    height: 12px;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    border: none;

    background-color: white;

    opacity: 0.6;
}


/* Active Dot */

.verticalIndicators button.active {
    opacity: 1;
    transform: scale(1.3);
}
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>
    <div class="container-fluid customCarousel">

    <div id="carouselExampleCaptions" class="carousel slide">

        <!-- Dot Indicators -->
        <div class="carousel-indicators customIndicators">

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="0"
                class="active"
                aria-current="true">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="1">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="2">
            </button>

        </div>

        <!-- Images -->
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="./assets/images1.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img src="./assets/images2.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 2">
            </div>

            <div class="carousel-item">
                <img src="./assets/images3.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 3">
            </div>

        </div>

        <!-- Previous -->
        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>

        </button>

        <!-- Next -->
        <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>

        </button>

    </div>

</div>


<hr>
<hr>


<div class="container-fluid customCarousel11">

    <div id="carouselExampleCaptions" class="carousel slide">

        <!-- Vertical Indicators -->
        <div class="carousel-indicators verticalIndicators">

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="1"
                aria-label="Slide 2">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="2"
                aria-label="Slide 3">
            </button>

        </div>


        <!-- Carousel Images -->

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="./assets/images1.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img src="./assets/images2.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 2">
            </div>

            <div class="carousel-item">
                <img src="./assets/images3.jpeg"
                    class="d-block customCarouselImg"
                    alt="Slide 3">
            </div>

        </div>


        <!-- Previous Button -->

        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

            <span class="visually-hidden">
                Previous
            </span>

        </button>


        <!-- Next Button -->

        <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

            <span class="visually-hidden">
                Next
            </span>

        </button>

    </div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
